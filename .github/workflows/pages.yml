name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 没有构建步骤：仓库里跑的就是线上跑的。这里只把要服务的三样拷进 _site，
      # 顺带保证 tools/ 与 test/ 不会跟着上线。
      - name: 组装站点
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
